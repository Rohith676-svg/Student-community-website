name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyAe1tPoQGBVYRp2WB14NM3MBWSODdjxfq0"
          VITE_FIREBASE_AUTH_DOMAIN: "stc1234-3cabb.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "stc1234-3cabb"
          VITE_FIREBASE_STORAGE_BUCKET: "stc1234-3cabb.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "23144272165"
          VITE_FIREBASE_APP_ID: "1:23144272165:web:439082178f19bc68c8cacc"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
